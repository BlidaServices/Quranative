name: Sync Telegram Photos to GitHub

on:
  workflow_dispatch: # تشغيل يدوي من تبويب Actions
  schedule:
    - cron: '0 12 * * *' # تشغيل تلقائي يومياً الساعة 12 ظهراً (اختياري)

permissions:
  contents: write # ضروري جداً للسماح للـ Action برفع الملفات للمستودع

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # لجلب تاريخ المستودع بالكامل لضمان دقة الـ Push

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install telethon

    - name: Run Sync Script
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        SESSION_STRING: ${{ secrets.SESSION_STRING }}
      run: python sync_photos.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "github-actions[bot]"
        
        # إضافة المجلد والملف النصي
        git add pictures/ last_id.txt
        
        # التحقق من وجود تغييرات قبل تنفيذ Commit
        if git diff --quiet && git diff --staged --quiet; then
          echo "لا توجد صور جديدة لمزامنتها حالياً."
        else
          git commit -m "Update: إضافة صور جديدة وتحديث آخر معرف رسالة (last_id)"
          git push origin main
        fi
