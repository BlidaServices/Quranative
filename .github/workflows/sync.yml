name: Sync Telegram Photos to GitHub

on:
  workflow_dispatch:

permissions:
  contents: write  # إعطاء صلاحية الكتابة للمستودع

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }} # استخدام التوكن الافتراضي

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install telethon

    - name: Run Sync Script
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        SESSION_STRING: ${{ secrets.SESSION_STRING }}
      run: python sync_photos.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "github-actions[bot]"
        git add pictures/
        # التأكد من وجود تغييرات قبل الالتزام
        if git diff --quiet && git diff --staged --quiet; then
          echo "لا توجد صور جديدة للمزامنة."
        else
          git commit -m "Add latest photos from Telegram"
          git push origin main
        fi
