name: Video Auto Uploader

on:
  schedule:
    - cron: '0 0 * * *' # يعمل تلقائياً مرة كل يوم (اختياري)
  workflow_dispatch: # يتيح لك تشغيل الكود يدوياً في أي وقت من تبويب Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install telethon PyGithub

    - name: Run Video Transfer Script
      env:
        # هنا يتم استدعاء التوكن من إعدادات الأمان في مستودعك
        GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      run: python video_to_github.py
